[package]
name = "tsess"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "tmux session manager: scan your projects, pick one, and attach with a declarative layout"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
shellexpand = "3"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
